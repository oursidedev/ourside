project_id = "ourside"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "https://app.getourside.com"
additional_redirect_urls = [
  "https://app.getourside.com/**",
  "https://getourside.com/**",
  "https://www.getourside.com/**",
  "https://*.vercel.app/**",
  "http://localhost:3000/**",
]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "10s"
otp_length = 6
# Supabase uses one expiry for email OTP links, including password recovery.
# Thirty minutes limits exposure while leaving enough time for email delivery.
otp_expiry = 1800

[auth.rate_limit]
email_sent = 30

[storage]
enabled = true
file_size_limit = "25MiB"
